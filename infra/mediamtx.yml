# MediaMTX config for DIUDARA live streaming (Task 6, design spec §5).
#
# This is an OVERRIDE file, not a full dump of MediaMTX's defaults — every
# key MediaMTX ships unset (see the vendored mediamtx.yml on GitHub, tag
# 1.20.0 — the image tag pinned in docker-compose.yml, which itself reports
# `mediamtx --version` as "v1.20.0") is left alone unless named here.
# `rtmp: true` and `hls: true` are already MediaMTX's defaults, for
# instance, so they are not repeated.
#
# ---------------------------------------------------------------------------
# authHTTPAddress carries NO secret here — TASK 6 CORRECTION, binding over
# the original brief.
#
# MediaMTX's authHTTPAddress mechanism has no option to attach a custom
# header to the POST it makes (verified against mediamtx.org/docs/features/
# authentication — its entire configuration surface for this mechanism is
# authMethod/authHTTPAddress/authHTTPExclude/authHTTPFingerprint/
# authInternalUsers/authJWT*, none of which lets a header be added). A
# config committed to git with the secret baked into this URL as a query
# parameter would ALSO put the secret in the repository's history — so it is
# not set in this file at all. It is injected at container start as the
# MTX_AUTHHTTPADDRESS environment override (MediaMTX's rule: any config key
# can be overridden by MTX_<UPPERCASE_KEY_NAME>), built in
# infra/docker-compose.yml from MEDIAMTX_WEBHOOK_SECRET in the gitignored
# infra/.env — see that file's own comment. That is also why authMethod is
# the only auth-related key set here: authHTTPAddress itself is deliberately
# absent, filled in only by the environment override.
#
# apps/api/src/routes/mediamtx-webhooks.ts reads the secret from EITHER a
# `secret` query parameter (what authHTTPAddress's POST can carry — the only
# option available to it) OR the `X-Mediamtx-Secret` header (what the
# runOnOnline/runOnOffline shell commands below CAN and DO send, since they
# are `wget` invocations, not authHTTPAddress's fixed POST). See that
# route's docstring for the full reasoning on why both mechanisms exist.
authMethod: http

# Every publish and every read is authorised against our own API — without
# this, access control is "the RTMP path is hard to guess", which is not
# access control (design spec §5).
#
# TASK 6 REVIEW NOTE: the brief called for `authHTTPExclude: []` — excluding
# NOTHING, so even api/metrics/pprof would be authorised against our API.
# What's written below is a DELIBERATE restoration of MediaMTX's own default
# (api/metrics/pprof excluded from HTTP-based auth entirely), not an
# oversight of that line. It is functionally inert either way on this
# deployment: `api`, `metrics` and `pprof` all default to `false` and are
# never turned on here, so no request of any of those three `action` values
# can ever reach this server for `authHTTPExclude` to have an opinion about.
# Restoring the default costs nothing and reads as intentional rather than
# as a value nobody looked at, which an explicit `[]` would not.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# Ports, and the asymmetry is deliberate (see docker-compose.yml's port
# mapping and CONTRIBUTING.md for the full reasoning):
#   - RTMP 1935 is published publicly. A creator's OBS connects from
#     outside, and publish authorisation (above) is what protects it.
#   - HLS 8888 is bound to 127.0.0.1 ONLY in docker-compose.yml's port
#     mapping. nginx on the real VPS proxies to it. Exposing 8888 publicly
#     would let anyone fetch segments directly, bypassing read
#     authorisation entirely — that authorisation IS the access-control
#     mechanism for who gets to watch a paid stream.
# The addresses below are both "listen on every interface inside the
# container" (":<port>", no host part) — the loopback restriction for HLS is
# enforced by the HOST port mapping, not by MediaMTX itself, the same way
# infra/docker-compose.yml already binds Postgres to 127.0.0.1.
rtmpAddress: :1935
hlsAddress: :8888

paths:
  all_others:
    # The publisher started / stopped. These are the real hook names: there
    # is no runOnPublish or runOnUnpublish, whatever an earlier draft of this
    # spec said. They are SHELL COMMANDS MediaMTX runs (not requests it
    # POSTs), so — unlike authHTTPAddress above — they CAN send a header, and
    # do: MEDIAMTX_WEBHOOK_SECRET is passed to the container's environment
    # (docker-compose.yml) precisely so this shell command can read it here.
    #
    # `wget`, NOT the brief's original `curl` — discovered running this
    # against a live container, not from documentation. The plain MediaMTX
    # image is `FROM scratch` (no shell, no `curl`, nothing but the binary)
    # and cannot run a shell command at all; docker-compose.yml switches to
    # the `-ffmpeg` tag for its Alpine/BusyBox userland, and Alpine does not
    # install `curl` by default either — only BusyBox's `wget`, which is
    # what actually ships inside that image. See docker-compose.yml's own
    # comment for the exact failure this replaced
    # (`runOnOnline command exited: exec: "curl": executable file not
    # found in $PATH`, observed against a real container).
    #
    # $MTX_PATH's runtime shape was the one assumption Task 6 existed to
    # test against a live server rather than mediamtx.org's docs alone —
    # apps/api/src/application/use-cases/authorise-stream.ts's
    # `streamKeyFromPath` requires exactly "live/<key>", and
    # handle-stream-lifecycle.ts logs a console.warn if $MTX_PATH ever
    # disagrees. CONFIRMED against a real publish: $MTX_PATH arrives as
    # exactly "live/<key>", matching what both use-cases assume — see
    # CONTRIBUTING.md's "Live streaming (MediaMTX)" section for what was
    # observed.
    runOnOnline: >
      wget -q -O- --header="X-Mediamtx-Secret: $MEDIAMTX_WEBHOOK_SECRET"
      --header="Content-Type: application/json"
      --post-data="{\"hook\":\"online\",\"streamKey\":\"$MTX_PATH\"}"
      http://host.docker.internal:3000/webhooks/mediamtx/lifecycle
    runOnOnlineRestart: false
    runOnOffline: >
      wget -q -O- --header="X-Mediamtx-Secret: $MEDIAMTX_WEBHOOK_SECRET"
      --header="Content-Type: application/json"
      --post-data="{\"hook\":\"offline\",\"streamKey\":\"$MTX_PATH\"}"
      http://host.docker.internal:3000/webhooks/mediamtx/lifecycle
