services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Sourced from infra/.env, which is gitignored. `:?` makes Compose refuse
      # to start rather than silently falling back to a committed default.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
    ports:
      # Bound to loopback, not 0.0.0.0. Spec 12 makes infra/ the VPS deploy
      # path, so a 0.0.0.0 binding would expose Postgres to the internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Task 6: MediaMTX, the RTMP/HLS server every publish and every read is
  # authorised against apps/api for (design spec §5). Pinned to a specific
  # tag, not `latest` — this config was written and verified against v1.20.0
  # (see CONTRIBUTING.md); an unpinned tag could silently change the
  # environment-variable override rule this compose file relies on
  # (MTX_AUTHHTTPADDRESS) out from under it.
  #
  # THE `-ffmpeg` VARIANT, NOT THE PLAIN ONE — discovered running this for
  # real, not from documentation. The plain `bluenviron/mediamtx:1.20.0`
  # image is built `FROM scratch`: no shell, no `curl`, nothing but the
  # `mediamtx` binary. `runOnOnline`/`runOnOffline` below are shell commands
  # (see mediamtx.yml's own comment on why they must be), and a `FROM
  # scratch` container cannot run one — MediaMTX itself confirmed this by
  # logging `runOnOnline command exited: exec: "curl": executable file not
  # found in $PATH`. The `-ffmpeg` tag is Alpine-based (see the project's
  # own docker/ffmpeg.Dockerfile) and ships BusyBox, which is where `/bin/sh`
  # and `wget` come from — NOT `curl`, which Alpine does not install by
  # default either. The hooks below use `wget`, not the brief's original
  # `curl`, for exactly this reason.
  mediamtx:
    image: bluenviron/mediamtx:1.20.0-ffmpeg
    restart: unless-stopped
    environment:
      # Read by infra/mediamtx.yml's runOnOnline/runOnOffline wget commands —
      # those ARE shell commands, so they can (and do) send this as a header.
      MEDIAMTX_WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET:?set MEDIAMTX_WEBHOOK_SECRET in infra/.env, matching apps/api/.env}
      # authHTTPAddress has NO way to send a header (see mediamtx.yml's own
      # comment on this), so the secret travels as a query parameter
      # instead — baked in HERE, as a container environment variable, rather
      # than into the committed mediamtx.yml file. MTX_<UPPERCASE_KEY> is
      # MediaMTX's own rule for overriding any config key via environment.
      MTX_AUTHHTTPADDRESS: http://host.docker.internal:3000/webhooks/mediamtx/auth?secret=${MEDIAMTX_WEBHOOK_SECRET:?set MEDIAMTX_WEBHOOK_SECRET in infra/.env, matching apps/api/.env}
      # Task 1 (browser publishing / WHIP): the server's public IP(s), NOT a
      # secret — see mediamtx.yml's own comment on webrtcAdditionalHosts for
      # why this is still an env override rather than a literal value in the
      # committed config (deployment-specific, exactly like
      # apps/api/.env's MEDIAMTX_RTMP_HOST). Comma-separated per MediaMTX's
      # own environment-override convention for list-typed keys. Optional —
      # no `:?` guard, unlike MEDIAMTX_WEBHOOK_SECRET above — because it is
      # only load-bearing once publisher and server are on DIFFERENT
      # machines; see infra/.env.example.
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS:-}
    # Fix round 1, Important 1: make a missing webrtcAdditionalHosts LOUD,
    # not silent. scripts/deploy.sh runs `docker compose up -d` on every
    # redeploy but deliberately never touches infra/.env — real secrets are
    # placed there by hand, once (see CONTRIBUTING.md) — so a production
    # infra/.env that never got MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS filled in
    # would otherwise fail in the WORST way: WebRTC still negotiates (the
    # local-interface ICE candidate still exists), just with no candidate a
    # REMOTE browser can ever reach, so `connectionState` simply never
    # becomes "connected" and NOTHING errors on either side — exactly the
    # failure mode this task's own brief named as the one to guard against.
    # This overrides the image's plain `/mediamtx` entrypoint with a
    # one-line shell check first (the `-ffmpeg` tag ships BusyBox's
    # `/bin/sh` for precisely this kind of thing — see the image comment
    # above) that prints an unmissable line to THIS container's own logs
    # (`docker logs infra-mediamtx-1`, the same place CONTRIBUTING.md's "A
    # failing hook is not silent, but it is easy to miss" section already
    # sends an operator looking) on every single start: a WARN if the
    # variable is empty, an INF confirming the value if it is not —
    # mirroring how `apps/api`'s own `[bootstrap] streaming provider: ...`
    # line always states which way an analogous all-or-nothing streaming
    # decision went, rather than staying quiet on the "everything is fine"
    # path and only speaking up on failure. Deliberately a WARNING, not a
    # failure: this variable is CORRECTLY empty for local same-machine
    # testing (see infra/.env.example), and refusing to start would block
    # boot for that legitimate case — ruled out explicitly by this task's
    # own review.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$MTX_WEBRTCADDITIONALHOSTS" ]; then
          echo "WARN [mediamtx] MEDIAMTX_WEBRTC_ADDITIONAL_HOSTS is unset (infra/.env). Browser publishing (WebRTC/WHIP) is enabled, but a remote browser's ICE negotiation will silently fail to connect any media unless this server's public IP is set here -- see infra/mediamtx.yml's webrtcAdditionalHosts comment and CONTRIBUTING.md's 'Browser publishing (WebRTC / WHIP)' section. Expected to be empty ONLY when the publishing browser and this server are the SAME machine (local dev)." >&2
        else
          echo "INF [mediamtx] browser publishing (WebRTC/WHIP): webrtcAdditionalHosts=$$MTX_WEBRTCADDITIONALHOSTS" >&2
        fi
        exec /mediamtx /mediamtx.yml
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # RTMP: public. A creator's OBS connects from outside this host, and
      # publish authorisation is what protects this port — see mediamtx.yml.
      - "1935:1935"
      # HLS: loopback ONLY, exactly like Postgres's binding above. nginx on
      # the real VPS proxies to this from the public https:// origin (see
      # CONTRIBUTING.md for the location block); publishing 8888 itself
      # would let anyone fetch segments with no read authorisation at all.
      - "127.0.0.1:8888:8888"
      # Task 1 (browser publishing / WHIP): WebRTC SIGNALLING — loopback
      # ONLY, exactly like HLS above and for the identical reason. nginx on
      # the real VPS proxies WHIP requests to this port from the public
      # https:// origin (see live-hls.conf.template); publishing 8889
      # itself would let anyone bypass authorisation and hit MediaMTX's own
      # (unauthenticated-by-default) publish/read test pages directly.
      - "127.0.0.1:8889:8889"
      # Task 1 (browser publishing / WHIP): WebRTC MEDIA — the actual
      # audio/video packets, all UDP, published PUBLICLY and DIRECTLY —
      # this is the one WebRTC port that is NOT loopback-restricted, and
      # deliberately: it is reached straight from a creator's browser, never
      # through nginx or Cloudflare, because Cloudflare's proxy does not
      # carry UDP at all (see mediamtx.yml's webrtcLocalUDPAddress comment).
      # This port, not 8889, is what must be open at the VPS provider's
      # firewall — a provider blocking it is one of the three specific
      # causes CONTRIBUTING.md and this task's brief call out if WebRTC does
      # not negotiate.
      - "8189:8189/udp"
    extra_hosts:
      # Lets the container reach the API on the Docker host as
      # host.docker.internal — required on LINUX (the production VPS):
      # Docker Desktop on macOS provides this mapping automatically, so this
      # line is a no-op locally but load-bearing in production. See
      # CONTRIBUTING.md.
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
